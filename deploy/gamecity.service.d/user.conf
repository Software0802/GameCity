# /etc/systemd/system/gamecity.service.d/user.conf — account override, installed once by hand
# when the box does not use the default gamecity:gamecity (deploy/README.md, first deploy).
# @RUN_USER@ / @RUN_GROUP@ are replaced with GAMECITY_RUN_USER / GAMECITY_RUN_GROUP.
[Service]
User=@RUN_USER@
Group=@RUN_GROUP@
