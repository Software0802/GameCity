# /etc/systemd/system/gamecity.service.d/release.conf — written by deploy/deploy.sh on every
# release so `systemctl show gamecity -p Environment` and journal lines name the running build.
# @RELEASE@ is replaced with <sha>-<ts>; the symlink /opt/gamecity/current points at it.
[Service]
Environment=GAMECITY_RELEASE=@RELEASE@
